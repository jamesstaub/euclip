name: CI
on:
  push: { branches: [main, master] }
  pull_request: {}
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_USER: euclip, POSTGRES_PASSWORD: euclip }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      POSTGRES_USER: euclip
      POSTGRES_PASSWORD: euclip
      POSTGRES_HOST: localhost
      # the test env needs credentials.yml.enc; add RAILS_MASTER_KEY under repo secrets
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { working-directory: server, bundler-cache: true }
      - run: bundle exec rails db:create db:schema:load
      - run: bundle exec rspec
  client-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { path: euclip }
      # INTERIM, until cracked-up is published to npm: client-v2 depends on "file:../../cracked-up",
      # a sibling of the repo checkout. Pinned to the same ref as the Dockerfile.
      - uses: actions/checkout@v4
        with:
          repository: jamesstaub/cracked-up
          ref: 2f70ab2194055cc31e8d06015e41c4e85e8e3096
          path: cracked-up
      - uses: actions/setup-node@v4
        with: { node-version: 22.15.0 }
      - run: npm ci && npm run build
        working-directory: cracked-up
      - run: npm ci
        working-directory: euclip/client-v2
      - run: npm run lint
        working-directory: euclip/client-v2
      - run: npm test
        working-directory: euclip/client-v2
