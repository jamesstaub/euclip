default: &default
  adapter: postgresql
  encoding: utf8
  pool: 5

development:
  <<: *default
  database: euclip_api_development
  host: localhost

test:
  <<: *default
  database: euclip_api_test

production:
  <<: *default
  database: <%= ENV['EUCLIP_API_DATABASE'] %>
  username: <%= ENV['EUCLIP_API_DATABASE_USER'] %>
  password: <%= ENV['EUCLIP_API_DATABASE_PASSWORD'] %>
