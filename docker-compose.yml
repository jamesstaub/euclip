# `docker compose up`            -> db + Rails (:3000), in containers
# `docker compose up -d db`      -> just Postgres (when running Rails natively via bin/dev)
# The client (client-v2) runs natively: it links the sibling cracked-up repo, which a container cannot see.
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: euclip
      POSTGRES_PASSWORD: euclip
      POSTGRES_DB: euclip_development
    ports:
      - "5432:5432"
    volumes:
      - euclip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U euclip -d euclip_development"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: docker/server.dev.Dockerfile
    depends_on:
      db: { condition: service_healthy }
    environment:
      RAILS_ENV: development
      POSTGRES_HOST: db
      POSTGRES_USER: euclip
      POSTGRES_PASSWORD: euclip
      POSTGRES_DB: euclip_development
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - euclip_bundle:/bundle
    command: >
      bash -c "bundle check || bundle install;
               rm -f tmp/pids/server.pid;
               bundle exec rails db:prepare &&
               bundle exec rails server -b 0.0.0.0 -p 3000"

volumes:
  euclip_pgdata:
  euclip_bundle:
