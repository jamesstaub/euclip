services:
  euclip_db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - euclip_network
    restart: always

  euclip_backend:
    build: ./
    depends_on:
      - euclip_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: euclip_db  # Use the service name as the hostname
      POSTGRES_PORT: 5432
    ports:
      - "3000:3000"
    volumes:
      - ./:/app  # Mount the current directory to /app
      - ./config/ssl:/app/config/ssl  # Mount SSL directory
    networks:
      - euclip_network
    command: ["sh", "-c", "rm -f /app/tmp/pids/server.pid && bundle exec puma -C config/puma.rb"]

  euclip_frontend:
    build:
      context: ../euclip  # Path to the Ember app
      dockerfile: Dockerfile
    depends_on:
      - euclip_backend
    ports:
      - "4200:4200"
    volumes:
      - ../euclip:/app
      - ../euclip/node_modules:/app/node_modules
      - ../euclip-api/config/ssl:/app/config/ssl  # Mount SSL directory
    networks:
      - euclip_network
    environment:
      BACKEND_URL: https://euclip_backend:3000

volumes:
  postgres_data:

networks:
  euclip_network:
